# Tells cert-manager how to get certificates: from Let's Encrypt (free, trusted
# by every browser), proving we own the domain with the HTTP-01 challenge.
#
# HTTP-01: Let's Encrypt asks for a secret file at
#   http://<domain>/.well-known/acme-challenge/<token>
# cert-manager briefly serves it through Traefik, Let's Encrypt checks it, and
# the certificate is issued. cert-manager renews it automatically before it expires.
#
# A ClusterIssuer works for every namespace. deploy-oracle.sh applies this file.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # cert-manager creates and keeps the Let's Encrypt account key in this Secret.
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
