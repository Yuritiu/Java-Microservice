# Serve the app on its public domain over HTTPS.
# DOMAIN_PLACEHOLDER is swapped for DOMAIN from settings.env by deploy-oracle.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-service-ingress
  annotations:
    # Asks cert-manager for a Let's Encrypt certificate for the host below and
    # stores it in the user-service-tls Secret. Renewed automatically.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
  - hosts:
    - DOMAIN_PLACEHOLDER
    secretName: user-service-tls
  rules:
  - host: DOMAIN_PLACEHOLDER
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: user-service-service
            port:
              number: 8080
