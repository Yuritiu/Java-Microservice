apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-postgres
  labels:
    app: user-service-postgres
spec:
  replicas: 1
  # The volume can only be attached to one pod at a time, so the old pod must
  # stop before the new one starts. The default (rolling) strategy would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-service-postgres
  template:
    metadata:
      labels:
        app: user-service-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: "user_service_db"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: user-service-db
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: user-service-db
              key: password
        # Store data in a subfolder. Cloud disks often have a lost+found folder
        # at the root, which makes Postgres refuse to initialise.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-postgres
spec:
  selector:
    app: user-service-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
