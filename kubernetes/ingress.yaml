# Routes outside HTTP traffic to the app's Service.
# Needs an nginx ingress controller: locally that's `minikube addons enable ingress`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-service-ingress
  annotations:
    # Rate limiting per visitor IP: about 10 requests a second, with short bursts
    # allowed (the Swagger page loads several files at once). Over the limit
    # gets a 503 from nginx instead of reaching the app.
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Reject request bodies over 16 KB. A user is a name and an email.
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
spec:
  ingressClassName: nginx
  rules:
  # No host set, so it answers on any address (the minikube IP locally).
  # A real domain gets added here once it's on Oracle.
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: user-service-service
            port:
              number: 8080
