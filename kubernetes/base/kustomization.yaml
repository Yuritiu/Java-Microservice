# The shared setup used everywhere. Don't apply this directly. Apply an overlay:
#   kubernetes/overlays/minikube   local cluster
#   kubernetes/overlays/oracle     Oracle Cloud (OKE)
# Each overlay starts from this base and changes only what differs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything goes in its own namespace, so it's easy to inspect or remove:
#   kubectl get all -n user-service
#   kubectl delete namespace user-service
namespace: user-service

resources:
  - namespace.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - redis-deployment.yaml
  - deployment.yaml
  - service.yaml
  - middlewares.yaml
  - ingress.yaml
  - demo-reset.yaml
