services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=db
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/user_service_db
      - SPRING_DATASOURCE_USERNAME=userservice_user
      - SPRING_DATASOURCE_PASSWORD=userservice_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: userservice_user
      POSTGRES_PASSWORD: userservice_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userservice_user -d user_service_db"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  redis:
    image: redis:8.10.2-alpine
    restart: always
    command: redis-server --port 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  postgres_data:
