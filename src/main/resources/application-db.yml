spring:
  # Defaults for Docker Compose. Kubernetes overrides these with
  # SPRING_DATASOURCE_* and SPRING_DATA_REDIS_* environment variables.
  datasource:
    url: jdbc:postgresql://db:5432/user_service_db
    username: userservice_user
    password: userservice_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  # Disable H2 console since we're using PostgreSQL
  h2:
    console:
      enabled: false

  # Redis configuration. Spring Boot 3 reads these under spring.data.redis
  # (the old spring.redis keys are ignored).
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

management:
  health:
    redis:
      enabled: true
