spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service_db
    username: userservice_user
    password: userservice_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  # Disable H2 console since we're using PostgreSQL
  h2:
    console:
      enabled: false

  # Redis configuration
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 20
        max-idle: 8
        min-idle: 0
  # Enable Redis caching
  cache:
    type: redis
