spring:
  datasource:
    url: jdbc:postgresql://db:5432/user_service_db
    username: userservice_user
    password: userservice_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  # Disable H2 console since we're using PostgreSQL
  h2:
    console:
      enabled: false

  # Redis configuration
  redis:
    host: redis
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 2000ms
        time-between-eviction-runs: 10000ms
      shutdown-timeout: 100ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 2000ms

management:
  health:
    redis:
      enabled: true