spring:
  profiles:
    active: db

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # Adds /actuator/health/liveness and /actuator/health/readiness,
      # which the Kubernetes probes use.
      probes:
        enabled: true
      group:
        readiness:
          # Only report "ready" once Postgres and Redis are reachable too.
          include: readinessState,db,redis
